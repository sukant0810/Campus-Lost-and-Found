{% extends "base.html" %}
{% block content %}
<div class="panel form-panel">
    <span class="badge {{ item.status|lower }}">{{ item.status }}</span>
    <h2>Edit Item</h2>
    <p class="muted">Update the details below. All fields are required.</p>
    <form method="post" novalidate>
        <div class="form-grid">
            <label>Item Name
                <input type="text" name="item_name" value="{{ form.item_name or '' }}" required>
            </label>
            <label>Category
                <select name="category" required>
                    <option value="">Select category</option>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if form.category==c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="full">Description
                <textarea name="description" rows="3" required>{{ form.description or '' }}</textarea>
            </label>
            <label>Location
                <input type="text" name="location" value="{{ form.location or '' }}" required>
            </label>
            <label>Date
                <input type="date" name="date_found" max="{{ today }}" value="{{ form.date_found or '' }}" required>
            </label>
            <label>Reported By
                <input type="text" name="owner_name" value="{{ form.owner_name or '' }}" required>
            </label>
            <label>Contact (email or phone)
                <input type="text" name="contact" value="{{ form.contact or '' }}" required>
            </label>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Save Changes</button>
            <a class="btn secondary" href="{{ url_for('details', item_id=item.id) }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
